[project]
name = "semantic-indexing-explorer"
version = "0.1.0"
description = "Interactive Streamlit app for learning how semantic indexing changes what a search finds"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "altair>=5",
    "numpy>=2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "sentence-transformers>=4",
    "streamlit>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
